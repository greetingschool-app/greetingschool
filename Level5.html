function $(id){return document.getElementById(id)}

function renderSpeak(){const w=speakWords[speakIndex];$('speakContent').innerHTML=`<div class="card"><span class="tag">SPEAKING · ${speakIndex+1}/5</span><h2>${esc(w)}</h2><div class="speakBox"><button class="primary" id="sampleBtn">🔊 Послушать образец</button><button class="mic" id="micBtn">🎙️</button><div id="speakStatus" class="muted">Нажми на микрофон и произнеси слово.</div></div></div>`;$('sampleBtn').addEventListener('click',()=>speakText(w));$('micBtn').addEventListener('click',()=>recognize(w))}
function normalize(s){return s.toLowerCase().replace(/[^a-z\s]/g,'').replace(/\s+/g,' ').trim()}
async function recognize(target){const status=$('speakStatus');const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){status.textContent='⚠️ Распознавание речи недоступно в этом браузере. Открой Level 5 в Safari/Chrome по HTTPS.';return}if(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia){try{await navigator.mediaDevices.getUserMedia({audio:true})}catch(e){status.textContent='⚠️ Разреши доступ к микрофону в настройках браузера и попробуй снова.';return}}if(recognition){try{recognition.abort()}catch(e){}}const r=new SR();recognition=r;r.lang='en-US';r.interimResults=false;r.maxAlternatives=3;status.textContent='🎙️ Слушаю…';r.onresult=e=>{const said=normalize(e.results[0][0].transcript);const want=normalize(target);const ok=said===want||said.includes(want)||want.includes(said);status.innerHTML=ok?'✅ Отлично! <button class="primary" id="nextSpeak">Следующее →</button>':`🔁 Ты сказал: <b>${esc(said)}</b><br>Попробуй ещё раз.`;if(ok)$('nextSpeak').addEventListener('click',nextSpeak)};r.onerror=e=>{const msg=e.error==='not-allowed'?'Разреши микрофон.':e.error==='no-speech'?'Не услышал речь — произнеси слово ещё раз.':'Не удалось распознать речь. Попробуй ещё раз.';status.textContent='⚠️ '+msg};try{r.start()}catch(e){status.textContent='⚠️ Не удалось запустить микрофон. Попробуй ещё раз.'}}
function nextSpeak(){speakIndex++;if(speakIndex>=5){$('speakContent').innerHTML='<div class="card"><h2>🏆 Speaking завершён!</h2><p class="muted">5 слов пройдено.</p><button class="primary" id="returnUnit">Вернуться к Unit</button></div>';$('returnUnit').addEventListener('click',()=>openUnit(currentUnit));return}renderSpeak()}
$('nextBtn').addEventListener('click',nextQuestion);$('unitBack').addEventListener('click',()=>show('home'));$('quizBack').addEventListener('click',()=>openUnit(currentUnit));$('speakBack').addEventListener('click',()=>openUnit(currentUnit));$('navHome').addEventListener('click',()=>show('home'));$('navUnit').addEventListener('click',()=>openUnit(currentUnit));$('navProgress').addEventListener('click',()=>show('home'));document.querySelectorAll('.mode').forEach(b=>b.addEventListener('click',()=>startMode(b.dataset.mode)));renderUnits();show('home');
</script></body></html>
