in.", "will", "is", "does"], ["Choose the correct sentence.", "They will arrive at six.", "They will arriving at six.", "They will to arrive at six."]], [["Choose the correct sentence.", "How many tickets have you got?", "How much tickets have you got?", "How many ticket have you got?"], ["Choose the correct sentence.", "How much water is there?", "How many water is there?", "How much waters are there?"], ["Choose the correct word.", "There are some pencils on the desk.", "There are any pencils on the desk.", "There is some pencils on the desk."], ["Choose the correct question.", "Are there any tickets?", "Are there some tickets?", "Is there any tickets?"], ["Choose the correct sentence.", "I don't have much money.", "I don't have many money.", "I don't have much moneys."]], [["Choose the correct sentence.", "I watch cartoons to relax.", "I watch cartoons for relax.", "I watch cartoons to relaxing."], ["Choose the correct question.", "How often do you watch TV?", "How often you watch TV?", "How often are you watch TV?"], ["Choose the correct answer.", "I watch it twice a week.", "I watch it two a week.", "I twice watch it a week."], ["Choose the correct sentence.", "She uses the remote control to change the channel.", "She uses the remote control for change the channel.", "She uses the remote control to changing the channel."], ["Choose the correct frequency phrase.", "They usually watch the news.", "They watch usually the news.", "They watch the news usual."]], [["Choose the correct sentence.", "I've printed my homework.", "I printed have my homework.", "I've print my homework."], ["Choose the correct question.", "Have you saved the document?", "Did you have saved the document?", "Have you save the document?"], ["Choose the correct negative.", "She hasn't sent the message.", "She haven't sent the message.", "She hasn't send the message."], ["Choose the correct form.", "We have used the printer.", "We has used the printer.", "We have use the printer."], ["Which sentence is correct?", "He has already finished.", "He have already finished.", "He has already finish."]], [["Choose the correct question.", "Have you ever seen a volcano?", "Did you ever seen a volcano?", "Have you ever saw a volcano?"], ["Choose the correct answer.", "Yes, I have.", "Yes, I did have.", "Yes, I has."], ["Choose the correct negative.", "I've never been to a desert.", "I never have been to a desert.", "I've never be to a desert."], ["Complete: She has ___ visited Australia.", "never", "didn't", "wasn't"], ["Which sentence is correct?", "Have they ever climbed a mountain?", "Have they ever climb a mountain?", "Did they ever climbed a mountain?"]], [["Choose the best advice.", "You should drink more water.", "You should to drink more water.", "You should drinking more water."], ["Choose the negative advice.", "You shouldn't eat too much sugar.", "You don't should eat too much sugar.", "You shouldn't to eat too much sugar."], ["Complete: I feel sick. I ___ sit down.", "could", "should", "am"], ["Choose the correct sentence.", "He has a headache.", "He have a headache.", "He having a headache."], ["Choose the correct question.", "Should I take some medicine?", "Should I to take some medicine?", "Do I should take some medicine?"]], [["Choose the correct sentence.", "Please help me with the smoothie.", "Please help I with the smoothie.", "Please help my with the smoothie."], ["Choose the correct pronoun: I can see ___.", "him", "he", "his"], ["Choose the correct question.", "Who made this smoothie?", "Who did made this smoothie?", "Who make this smoothie?"], ["Choose the correct sentence.", "The blender, which is new, is very fast.", "The blender, who is new, is very fast.", "The blender which it is new is very fast."], ["Choose the correct pronoun: Give the recipe to ___.", "her", "she", "hers"]], [["Choose the correct sentence.", "We were fishing at five o'clock.", "We was fishing at five o'clock.", "We were fish at five o'clock."], ["Choose the correct question.", "What were you doing?", "What was you doing?", "What did you doing?"], ["Complete: She ___ born in 2012.", "was", "were", "is"], ["Choose the correct sentence.", "They were walking when it started to rain.", "They was walking when it started to rain.", "They were walk when it started to rain."], ["Choose the correct form.", "I was sleeping at ten.", "I were sleeping at ten.", "I was sleep at ten."]], [["Choose the correct sentence.", "I was working when my boss called.", "I were working when my boss called.", "I was work when my boss called."], ["Choose the correct sentence.", "They're in the office.", "Their in the office.", "There in the office."], ["Choose the correct word: The builders finished ___ work.", "their", "they're", "there"], ["Choose the correct sentence.", "There are two vets at the clinic.", "Their are two vets at the clinic.", "They're are two vets at the clinic."], ["Choose the correct sentence.", "The journalist was writing the story.", "The journalist were writing the story.", "The journalist was write the story."]]];

the keyboard.", "keyboard"], ["Open the website.", "website"], ["Save it on the memory stick.", "memory stick"]], [["The volcano is amazing.", "volcano"], ["We stayed in a village.", "village"], ["The rainforest is wet.", "rainforest"], ["The desert is hot.", "desert"], ["They went on an expedition.", "expedition"]], [["I have a headache.", "headache"], ["He has a cough.", "cough"], ["My earache is painful.", "earache"], ["She has a sore throat.", "sore throat"], ["Take your medicine.", "medicine"]], [["I made a strawberry smoothie.", "smoothie"], ["The blender is in the kitchen.", "blender"], ["Add a strawberry.", "strawberry"], ["Cut the mango.", "mango"], ["Follow the recipe.", "recipe"]], [["My wife was fishing.", "wife"], ["Her husband was at home.", "husband"], ["My niece is eight.", "niece"], ["His nephew is ten.", "nephew"], ["All our relatives came.", "relatives"]], [["The boss called me.", "boss"], ["She works in an office.", "office"], ["The builder is busy.", "builder"], ["The vet helped the dog.", "vet"], ["The journalist wrote a story.", "journalist"]]];

let current=0, currentMode='words', q=0, score=0, opts=[], correct='';

function shuffle(a){return [...a].sort(()=>Math.random()-0.5)}

function speak(text){
  if(!('speechSynthesis' in window)){
    showFeedback('⚠️ Аудио недоступно в этом браузере.');
    return;
  }
  try{
    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(text);
    u.lang='en-US';
    u.rate=.86;
    u.pitch=1;
    // iOS Safari can need an explicit resume after cancel().
    if (speechSynthesis.resume) speechSynthesis.resume();
    speechSynthesis.speak(u);
  }catch(e){
    showFeedback('⚠️ Не удалось включить аудио. Попробуй ещё раз.');
  }
}

function showFeedback(msg){
  const fb=document.getElementById('fb');
  if(fb) fb.innerHTML='<div class="feedback">'+msg+'</div>';
}

function home(){
 currentMode='words'; q=0; score=0;
 document.getElementById('content').style.display='none';
 document.getElementById('home').style.display='block';
 const h=document.getElementById('home');
 h.innerHTML='<div class="card"><span class="tag">Сегодняшняя миссия</span><h2>Unit 1 · '+units[0].title+'</h2><p class="muted">Words · Grammar · Listening · Speaking</p><button id="startUnit" class="primary">Начать</button></div><h2>Units 1–15</h2><div class="unit-grid">'+units.map((u,i)=>'<button class="unit" data-unit="'+(i+1)+'"><b>Unit '+u.n+' · '+u.title+'</b><br><span class="muted">'+u.topic+'</span></button>').join('')+'</div>';
 document.getElementById('startUnit').addEventListener('click',()=>openUnit(1));
 h.querySelectorAll('[data-unit]').forEach(b=>b.addEventListener('click',()=>openUnit(Number(b.dataset.unit))));
 setTabs();
}

function openUnit(n){
 current=n-1; q=0; score=0;
 document.getElementById('home').style.display='none';
 document.getElementById('content').style.display='block';
 render(); window.scrollTo(0,0);
}

function setTabs(){
 ['Words','Grammar','Listen','Speak'].forEach(x=>{
   const el=document.getElementById('t'+x);
   el.classList.toggle('active',currentMode===x.toLowerCase());
 });
}

function mode(m){
 currentMode=m; q=0; score=0;
 if(document.getElementById('content').style.display!=='none') render();
 setTabs();
}

function render(){
 setTabs();
 const u=units[current];
 if(currentMode==='words') renderWords(u);
 if(currentMode==='grammar') renderGrammar(u);
 if(currentMode==='listen') renderListen(u);
 if(currentMode==='speak') renderSpeak(u);
}

function bindOptions(correctAnswer, values){
 const box=document.getElementById('content');
 box.querySelectorAll('.option').forEach(btn=>{
   btn.addEventListener('click',()=>{
     box.querySelectorAll('.option').forEach(x=>x.disabled=true);
     const choice=btn.dataset.value;
     const ok=choice===correctAnswer;
     btn.classList.add(ok?'correct':'wrong');
     const fb=document.getElementById('fb');
     fb.innerHTML='<div class="feedback">'+(ok?'✅ Отлично!':'❌ Правильный ответ: <b>'+htmlEscape(correctAnswer)+'</b>')+'</div>';
     if(ok) score++;
     const nextBtn=document.getElementById('next');
     if(nextBtn) nextBtn.style.display='inline-block';
   });
 });
}

function htmlEscape(v){
 return String(v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function renderWords(u){
 const target=u.vocab[q];
 const other=shuffle(units.filter((x,i)=>i!==current).flatMap(x=>x.vocab)).slice(0,3);
 opts=shuffle([target,...other]); correct=target;
 const c=document.getElementById('content');
 c.innerHTML='<div class="card"><span class="tag">WORDS · '+(q+1)+'/5</span><h2>Выбери слово из темы: '+htmlEscape(u.topic)+'</h2><p class="muted">Одно слово относится к текущей теме.</p>'+opts.map(x=>'<button class="option" data-value="'+htmlEscape(x)+'">'+htmlEscape(x)+'</button>').join('')+'<div id="fb"></div><button id="next" class="primary" style="display:none;margin-top:14px">Следующее →</button></div>';
 bindOptions(correct,opts);
 document.getElementById('next').addEventListener('click',next);
}

function renderGrammar(u){

 bindOptions(correct,choices);

}

function renderListen(u){

function renderSpeak(u){
 const w=u.vocab[q];

 c.innerHTML='<div class="card"><span class="tag">SPEAKING · '+(q+1)+'/5</span><h2>'+htmlEscape(w)+'</h2><div class="listenbox"><button id="speakSample" class="speakbtn" aria-label="Послушать образец">🔊</button><p class="muted">Послушай образец, затем произнеси слово.</p><button id="checkSpeak" class="primary">🎙️ Проверить</button><div id="fb"></div></div></div>';

function next(){
 q++;

   const c=document.getElementById('content');
   c.innerHTML='<div class="card"><span class="tag">'+currentMode.toUpperCase()+' · 5/5</span><h2>🏆 Unit завершён!</h2><p>Результат: <b>'+score+'/5</b></p><button id="repeat" class="primary">Повторить Unit</button></div>';
   document.getElementById('repeat').addEventListener('click',()=>openUnit(current+1));
   return;
 }
 render();
}

function recognize(target){
 const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
 if(!SR){
   showFeedback('⚠️ Распознавание речи недоступно в этом браузере. Для Speaking нужен браузер с поддержкой микрофона.');
   return;
 }
 try{
   const r=new SR();
   r.lang='en-US'; r.interimResults=false; r.maxAlternatives=1;
   r.onresult=e=>{
     const said=e.results[0][0].transcript.toLowerCase().trim();
     const ok=said===target.toLowerCase();
     showFeedback(ok?'✅ Отлично!':'🔁 Ты сказал: '+htmlEscape(said)+'<br>Попробуй ещё раз.');
   };
   r.onerror=()=>showFeedback('⚠️ Не удалось распознать. Разреши микрофон и попробуй ещё раз.');
   r.start();
 }catch(e){
   showFeedback('⚠️ Не удалось запустить микрофон. Проверь разрешение браузера.');
 }
}
