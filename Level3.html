<body>
<div class="app">
<header><div class="top"><div class="logo">🎓 Greetingschool</div><div class="avatar">👦</div></div>
<h1>Level 3 · Family and Friends 3</h1>
<div class="sub">Class Book + Workbook · Words + Grammar + Listening + Speaking</div>
<div class="bar"><i></i></div><div style="margin-top:8px">15 Units · адаптивные задания</div></header>
<main>
<section id="home">
<div class="card hero"><b>🎯 Сегодняшняя миссия</b><h2 id="mission">Unit 1 · They’re from Australia!</h2><div class="muted">Words · Grammar · Listening · Speaking</div><button class="primary" onclick="openUnit(1)">Начать</button></div>
<div class="sectionTitle">Units 1–15</div><div id="unitList"></div>
</section>
<section id="unit" style="display:none"><button class="back" onclick="show('home')">← Назад</button><div id="unitContent"></div></section>
<section id="quiz" style="display:none"><button class="back" onclick="show('unit')">← Назад</button><div class="modes">
<button id="mWords" class="mode" onclick="startMode('words')">🧠 Words</button>
<button id="mGrammar" class="mode" onclick="startMode('grammar')">🔤 Grammar</button>
<button id="mListen" class="mode" onclick="startMode('listen')">🎧 Listen</button>
<button id="mSpeak" class="mode" onclick="startMode('speak')">🗣 Speak</button></div>
<div class="tag" id="quizTag"></div><div id="quizQuestion" class="question"></div><div id="listenBox"></div><div id="answers" class="answers"></div><div id="feedback" class="feedback" style="display:none"></div>
<button id="nextBtn" class="primary" style="display:none" onclick="nextQuestion()">Следующее →</button></section>
<section id="speak" style="display:none"><button class="back" onclick="show('unit')">← Назад</button><div id="speakContent"></div></section>
</main>
<nav class="bottom"><button class="nav active" onclick="show('home')">🏠<br>Курс</button><button class="nav" onclick="openUnit(currentUnit)">⚡<br>Тренировка</button><button class="nav" onclick="show('home')">📈<br>Прогресс</button></nav>
</div>
<script>
const units=[{"n": 1, "title": "They’re from Australia!", "topic": "Countries, seasons & home", "grammar": "Present simple with be: Where are you from? / Where is he from?", "vocab": ["Egypt", "the UK", "Russia", "Spain", "Thailand", "Australia", "the USA", "Brazil", "spring", "summer", "autumn", "winter", "garden", "season"]}, {"n": 2, "title": "My weekend", "topic": "Hobbies", "grammar": "like + verb-ing; Do/Does ... like ...?", "vocab": ["read comics", "skateboard", "do gymnastics", "play chess", "fish", "play basketball", "take photos", "play volleyball", "play the guitar", "shop", "cook", "paint", "play the piano", "visit family"]}, {"n": 3, "title": "My things", "topic": "Things, collections & phrasal verbs", "grammar": "your / our / their; Can I ...? Yes, you can. / No, you can’t.", "vocab": ["computer", "TV", "DVD player", "CD player", "MP3 player", "camera", "stickers", "posters", "comics", "postcards", "badges", "shells", "turn on", "turn off"]}, {"n": 4, "title": "We’re having fun at the beach!", "topic": "Water sports & places", "grammar": "Present continuous: affirmative and negative", "vocab": ["swim", "sail", "dive", "surf", "kayak", "windsurf", "snorkel", "waterski", "beach", "sea", "polluted", "clean", "dangerous", "safe", "beautiful", "ugly"]}, {"n": 5, "title": "A naughty monkey!", "topic": "Animals & describing things", "grammar": "Present continuous: questions and short answers", "vocab": ["monkey", "lion", "mouse", "elephant", "crocodile", "giraffe", "tiger", "snake", "big", "small", "funny", "naughty", "clever", "hungry"]}, {"n": 6, "title": "Jim’s day", "topic": "Daily routine & time words", "grammar": "Present simple: affirmative, negative and questions", "vocab": ["have a shower", "brush my teeth", "get dressed", "have breakfast", "brush my hair", "get up", "catch the bus", "walk to school", "have lunch", "go home", "do homework", "go to bed"]}, {"n": 7, "title": "Places to go!", "topic": "Places in town & performances", "grammar": "Present simple + always / sometimes / never; in / on / at", "vocab": ["café", "library", "museum", "playground", "shopping mall", "sports centre", "swimming pool", "cinema", "play", "theatre", "concert", "actor", "film", "singer"]}, {"n": 8, "title": "I’d like a melon!", "topic": "Food & shopping", "grammar": "Countable / uncountable nouns; a / an / some; I’d like ...", "vocab": ["pasta", "bread", "cereal", "meat", "melon", "cucumber", "onion", "lemon", "potato", "butter", "cheese", "salt", "pepper", "peas"]}, {"n": 9, "title": "The fastest animal in the world", "topic": "Food & describing places", "grammar": "Comparative and superlative adjectives", "vocab": ["lake", "mountain", "waterfall", "ocean", "country", "bridge", "river", "wide", "big", "deep", "high", "old", "long", "fast", "faster", "fastest"]}, {"n": 10, "title": "In the park!", "topic": "Park things & rules", "grammar": "must / mustn’t for rules and obligations", "vocab": ["path", "grass", "flowers", "bin", "trees", "playground", "fountain", "litter", "shout", "chase", "catch", "meet", "cross", "laugh"]}, {"n": 11, "title": "In the museum", "topic": "Transport, places & the past", "grammar": "Past simple with be; there was / there were; some / any", "vocab": ["ferry", "bus", "helicopter", "motorbike", "plane", "taxi", "train", "tram", "along", "through", "between", "inside", "yesterday", "last week"]}, {"n": 12, "title": "A clever baby!", "topic": "Describing people", "grammar": "Past simple with be and have: affirmative and negative", "vocab": ["old", "young", "handsome", "pretty", "short", "tall", "shy", "friendly", "cheerful", "miserable", "relaxed", "worried", "mean", "generous"]}, {"n": 13, "title": "The Ancient Egyptians", "topic": "Verbs & describing things", "grammar": "Past simple with regular verbs: affirmative and negative", "vocab": ["start", "finish", "love", "hate", "want", "use", "laugh", "live", "heavy", "light", "hard", "soft", "easy", "difficult"]}, {"n": 14, "title": "Did you have a good day?", "topic": "School & camping things", "grammar": "Past simple questions: Did ...? What / When / Where ...?", "vocab": ["paint", "paintbrush", "calculator", "lunch box", "dictionary", "PE kit", "backpack", "apron", "tent", "sleeping bag", "torch", "camping"]}, {"n": 15, "title": "Our holiday!", "topic": "Holiday things & time words", "grammar": "be going to + verb", "vocab": ["suitcase", "sun cream", "towel", "soap", "shampoo", "hairbrush", "toothbrush", "toothpaste", "swimsuit", "passport", "tomorrow", "next week", "later", "on Saturday"]}];
let currentUnit=1,currentMode='words',qIndex=0,currentSet=[],correctAnswer='',score=0;
const grammarMap=[[["Where are you from?", "I’m from Egypt.", "He’s from Egypt.", "They’re from Egypt.", "Egypt"], ["Where are you from?", "I’m from Brazil.", "He’s from Brazil.", "They’re from Brazil.", "Brazil"], ["Where are you from?", "I’m from Australia.", "He’s from Australia.", "They’re from Australia.", "Australia"], ["Where are you from?", "I’m from Spain.", "He’s from Spain.", "They’re from Spain.", "Spain"], ["Where are you from?", "I’m from Russia.", "He’s from Russia.", "They’re from Russia.", "Russia"]], [["I like ___.", "reading comics", "I like to a.", "I likes reading comics.", "🎯"], ["I like ___.", "skateboarding", "I like to a.", "I likes skateboarding.", "🎯"], ["I like ___.", "playing chess", "I like to a.", "I likes playing chess.", "🎯"], ["I like ___.", "cooking", "I like to a.", "I likes cooking.", "🎯"], ["I like ___.", "playing the guitar", "I like to a.", "I likes playing the guitar.", "🎯"]], [["That is ___ computer.", "their", "That is I computer.", "That are computer.", "their"], ["That is ___ camera.", "our", "That is I camera.", "That are camera.", "our"], ["That is ___ CD player.", "your", "That is I CD player.", "That are CD player.", "your"], ["That is ___ postcards.", "their", "That is I postcards.", "That are postcards.", "their"], ["That is ___ shells.", "our", "That is I shells.", "That are shells.", "our"]], [["Look! I ___ in the sea.", "am swimming.", "is swimming.", "am swim.", "🏊"], ["They ___ surfing now.", "are", "is", "am", "🏄"], ["She ___ snorkelling.", "isn't", "aren't", "don't", "🤿"], ["We ___ sailing.", "are", "isn't", "am", "⛵"], ["He ___ waterskiing.", "isn't", "aren't", "don't", "🚤"]], [["___ the monkey eating?", "Is", "Are", "Do", "🐒"], ["Is the lion sleeping?", "Yes, it is.", "Yes, they are.", "Yes, he does.", "🦁"], ["Are the elephants running?", "No, they aren't.", "No, it isn't.", "No, they don't.", "🐘"], ["___ the crocodile eating?", "Is", "Are", "Does", "🐊"], ["Is the tiger jumping?", "No, it isn't.", "No, they aren't.", "No, he doesn't.", "🐯"]], [["Jim ___ up at seven.", "gets", "get", "does get", "⏰"], ["He ___ breakfast at eight.", "has", "have", "having", "🍳"], ["Jim ___ walk to school on Sunday.", "doesn't", "don't", "isn't", "🎒"], ["___ he catch the bus?", "Does", "Do", "Is", "🚌"], ["They ___ homework after school.", "do", "does", "doing", "📚"]], [["I ___ go to the library.", "sometimes", "am", "at", "📚"], ["She ___ goes to the cinema.", "always", "is", "on", "🎬"], ["My birthday is ___ May.", "in", "on", "at", "🎂"], ["We play tennis ___ Saturday.", "on", "in", "at", "🎾"], ["The concert is ___ six o’clock.", "at", "in", "on", "🎤"]], [["I’d like ___ melon.", "a", "an", "some", "🍈"], ["I’d like ___ apple.", "an", "a", "some", "🍎"], ["Would you like ___ cereal?", "some", "a", "an", "🥣"], ["I’d like ___ bread.", "some", "a", "an", "🍞"], ["Would you like some cheese?", "Yes, please.", "Yes, a.", "Yes, an.", "🧀"]], [["A cheetah is ___ than a lion.", "faster", "fast", "fastest", "🐆"], ["The blue whale is the ___ animal.", "biggest", "bigger", "big", "🐋"], ["A mountain can be ___ than a hill.", "higher", "high", "highest", "⛰️"], ["The Pacific is the ___ ocean.", "largest", "larger", "large", "🌊"], ["A river can be ___ than a stream.", "longer", "longest", "long", "🏞️"]], [["You ___ walk on the path.", "must", "mustn’t", "can’t", "🚶"], ["You ___ pick the flowers.", "mustn’t", "must", "are", "🌷"], ["You ___ put litter in the bin.", "must", "mustn’t", "is", "🗑️"], ["You ___ shout in the park.", "mustn’t", "must", "are", "🤫"], ["You ___ cross the path carefully.", "must", "mustn’t", "is", "🚸"]], [["There ___ a park here fifty years ago.", "was", "were", "are", "🏞️"], ["There ___ two trains yesterday.", "were", "was", "is", "🚆"], ["There ___ any buses then.", "weren’t", "wasn’t", "isn’t", "🚌"], ["There ___ a museum in the town.", "was", "were", "are", "🏛️"], ["There ___ some trains a hundred years ago.", "were", "was", "is", "🚂"]], [["I ___ short when I was five.", "was", "were", "had", "👦"], ["We ___ happy yesterday.", "were", "was", "had", "😊"], ["He ___ black hair when he was young.", "had", "has", "was", "💇"], ["She ___ tall when she was six.", "wasn't", "weren't", "didn't", "📏"], ["They ___ worried last week.", "were", "was", "had", "😟"]], [["They ___ in Egypt long ago.", "lived", "live", "didn't lived", "🏺"], ["He ___ his work yesterday.", "finished", "finish", "didn't finished", "✅"], ["They ___ pizza in Ancient Egypt.", "didn't cook", "didn't cooked", "not cook", "🍕"], ["She ___ the story.", "loved", "love", "didn't loves", "❤️"], ["He ___ the old stone.", "used", "use", "didn't used", "🪨"]], [["___ you have a good day?", "Did", "Do", "Were", "❓"], ["Did you paint a picture?", "Yes, I did.", "Yes, I do.", "Yes, I was.", "🎨"], ["___ did you go yesterday?", "Where", "What", "When", "📍"], ["___ did you finish school?", "When", "Where", "Who", "⏰"], ["Did she walk to school?", "No, she didn’t.", "No, she doesn’t.", "No, she wasn’t.", "🚶"]], [["I’m going to ___ tomorrow.", "swim", "swimming", "swam", "🏊"], ["She’s going to ___ a book.", "read", "reads", "reading", "📖"], ["Are you going to play football?", "Yes, I am.", "Yes, I do.", "Yes, I did.", "⚽"], ["They’re going to ___ next week.", "travel", "travelling", "travelled", "✈️"], ["He isn’t going to ___ late.", "sleep", "sleeping", "slept", "😴"]]];

function show(id){document.querySelectorAll('main>section').forEach(s=>s.style.display='none');document.getElementById(id).style.display='block';window.scrollTo(0,0)}
function shuffle(a){return [...a].sort(()=>Math.random()-0.5)}
function esc(s){return String(s).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]))}
function renderUnits(){document.getElementById('unitList').innerHTML=units.map(u=>`<article class="unit" onclick="openUnit(${u.n})"><div class="unitHead"><div class="unitNum">${u.n}</div><div><div class="unitTitle">${u.title}</div><div class="muted">${u.topic}</div></div></div><div class="chips">${u.vocab.slice(0,8).map(w=>`<span class="chip">${w}</span>`).join('')}</div></article>`).join('')}
function openUnit(n){currentUnit=n;const u=units[n-1];document.getElementById('unitContent').innerHTML=`<div class="card hero"><span class="tag">UNIT ${n}</span><h2>${u.title}</h2><div class="muted">${u.topic}</div><div class="chips">${u.vocab.map(w=>`<span class="chip">${w}</span>`).join('')}</div></div><div class="card"><b>🔤 Грамматика</b><p class="muted">${u.grammar}</p><b>🎧 Аудирование</b><p class="muted">5 разных фраз для каждого Unit.</p><b>🗣 Говорение</b><p class="muted">5 слов + короткие фразы для произношения.</p><button class="primary" onclick="startMode('words')">🧠 Слова</button><button class="primary" onclick="startMode('grammar')">🔤 Грамматика</button><button class="primary" onclick="startMode('listen')">🎧 Аудирование</button><button class="primary" onclick="startMode('speak')">🗣 Говорение</button></div>`;show('unit')}
function setMode(m){document.querySelectorAll('.mode').forEach(x=>x.classList.remove('active'));document.getElementById('m'+m[0].toUpperCase()+m.slice(1)).classList.add('active')}
function startMode(m){currentMode=m;qIndex=0;score=0;currentSet=[];setMode(m);if(m==='speak'){startSpeaking();return}show('quiz');renderQuestion()}
function getWords(){const u=units[currentUnit-1];const topic=shuffle([...new Set(u.vocab)]).slice(0,5);const other=shuffle([...new Set(units.filter(x=>x.n!==currentUnit).flatMap(x=>x.vocab))]);return topic.map(correct=>{const opts=[correct,...other.filter(x=>x!==correct).slice(0,3)];return{correct,opts:shuffle(opts)}})}
function getListen(){const u=units[currentUnit-1];return shuffle([...new Set(u.vocab)]).slice(0,5).map((word,i)=>({word,text:makeSentence(word,currentUnit,i)}))}
function makeSentence(word,n,i){const w=word;const plural=/s$/.test(w)&&!['bus','grass'].includes(w);if(n===1)return plural?'These are '+w+'.':'This is '+w+'.';if(n===2)return 'I like '+w+'.';if(n===3)return 'I have '+w+'.';if(n===4)return i%2?'She is '+w+'.':'They are '+w+'.';if(n===5)return 'I '+w+' every day.';if(n===6)return 'I '+w+' every day.';if(n===7)return 'I go to the '+w+'.';if(n===8)return 'I’d like some '+w+'.';if(n===9)return 'The '+w+' is very interesting.';if(n===10)return 'You must not '+w+'.';if(n===11)return 'There was a '+w+'.';if(n===12)return 'He is '+w+'.';if(n===13)return 'They '+w+' yesterday.';if(n===14)return 'I have a '+w+'.';return 'I’m going to take my '+w+'.'}
function renderAnswers(opts,correct){const clean=shuffle([...new Set([correct,...opts.filter(x=>x!==correct)])]).slice(0,4);correctAnswer=correct;document.getElementById('answers').innerHTML=clean.map((o,i)=>`<button class="answer" onclick="answer(this,${i})">${o}</button>`).join('');window._opts=clean}
function renderQuestion(){document.getElementById('feedback').style.display='none';document.getElementById('nextBtn').style.display='none';document.getElementById('listenBox').innerHTML='';const u=units[currentUnit-1];
if(currentMode==='words'){if(qIndex===0)currentSet=getWords();const q=currentSet[qIndex];document.getElementById('quizTag').textContent='WORDS · '+(qIndex+1)+'/5';document.getElementById('quizQuestion').innerHTML='Выбери слово из темы: <b>'+u.topic+'</b>';renderAnswers(q.opts,q.correct)}
else if(currentMode==='grammar'){if(qIndex===0)currentSet=grammarMap[currentUnit-1];const q=currentSet[qIndex];document.getElementById('quizTag').textContent='GRAMMAR · '+(qIndex+1)+'/5';document.getElementById('quizQuestion').innerHTML='<div class="visual">'+q[4]+'</div>'+q[0];renderAnswers([q[1],q[2],q[3]],q[1])}
else if(currentMode==='listen'){if(qIndex===0)currentSet=getListen();const q=currentSet[qIndex];document.getElementById('quizTag').textContent='LISTEN · '+(qIndex+1)+'/5';document.getElementById('quizQuestion').textContent='Послушай фразу и выбери слово, которое услышал:';document.getElementById('listenBox').innerHTML='<div class="listen"><button onclick="speakText(currentSet[qIndex].text)">🔊</button><div style="margin-top:8px;color:#666">Нажми, чтобы прослушать</div></div>';renderAnswers([q.word,...shuffle(u.vocab.filter(x=>x!==q.word)).slice(0,3)],q.word);speakText(q.text)}
}
function answer(el,i){document.querySelectorAll('.answer').forEach(x=>x.disabled=true);const choice=window._opts[i];const ok=choice===correctAnswer;el.classList.add(ok?'correct':'wrong');document.getElementById('feedback').style.display='block';document.getElementById('feedback').innerHTML=ok?'✅ Отлично! +20 XP':'❌ Правильный ответ: <b>'+correctAnswer+'</b>';score+=ok?1:0;document.getElementById('nextBtn').style.display='block'}
function nextQuestion(){qIndex++;if(qIndex>=5){document.getElementById('feedback').style.display='block';document.getElementById('feedback').innerHTML='🏆 Unit завершён! Результат: <b>'+score+'/5</b>';document.getElementById('nextBtn').style.display='none';return}renderQuestion()}
function speakText(t){if('speechSynthesis' in window){speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='en-US';u.rate=.86;speechSynthesis.speak(u)}}
let speakIndex=0,speakWords=[];
function startSpeaking(){speakWords=shuffle(units[currentUnit-1].vocab).slice(0,5);speakIndex=0;show('speak');renderSpeak()}
function renderSpeak(){const w=speakWords[speakIndex];document.getElementById('speakContent').innerHTML=`<div class="card"><span class="tag">SPEAKING · ${speakIndex+1}/5</span><h2>${w}</h2><div class="speakBox"><button class="primary" onclick="speakText('${w.replace(/'/g,"\\'")}')">🔊 Послушать образец</button><button class="mic" onclick="recognize('${w.replace(/'/g,"\\'")}')">🎙️</button><div id="speakStatus" class="muted">Нажми на микрофон и произнеси слово.</div></div></div>`}
function recognize(target){const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){document.getElementById('speakStatus').textContent='⚠️ Распознавание речи недоступно в этом браузере.';return}const r=new SR();r.lang='en-US';r.interimResults=false;r.maxAlternatives=1;r.onresult=e=>{const said=e.results[0][0].transcript.toLowerCase().trim();const ok=said===target.toLowerCase();document.getElementById('speakStatus').innerHTML=(ok?'✅ Отлично!':'🔁 Ты сказал: '+said+'<br>Попробуй ещё раз.')+(ok?' <button class="primary" onclick="nextSpeak()">Следующее →</button>':'')};r.onerror=()=>document.getElementById('speakStatus').textContent='⚠️ Не удалось распознать. Разреши микрофон и попробуй ещё раз.';r.start()}
function nextSpeak(){speakIndex++;if(speakIndex>=5){document.getElementById('speakContent').innerHTML='<div class="card"><h2>🏆 Speaking завершён!</h2><button class="primary" onclick="openUnit(currentUnit)">Вернуться к Unit</button></div>';return}renderSpeak()}
renderUnits();show('home');
</script>
</body></html>
